[pytest]
# Minimal pytest configuration for NanoBio Studio.
#
# testpaths deliberately excludes the repository root: the legacy root-level
# test_*.py files are print-based scripts, several of which mutate real
# databases (test_db_insertion.py, test_delete_trial.py, test_database.py) and
# one of which performs live network calls (test_live_toxcast_api.py). They are
# not safe to collect. They remain on disk untouched as legacy reference.
testpaths = tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    known_defect: pins current WRONG behaviour so its removal is detectable. Never a migration target. Run "-m 'not known_defect'" for the contract that must hold.
    slow: takes more than a few seconds.

# Keep output readable for a 300+ vector parametrised suite.
addopts =
    --strict-markers
    --tb=short
    -ra
